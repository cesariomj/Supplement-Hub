<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplement Hub</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SuppHub">
    <meta name="theme-color" content="#10b981">

    <!-- Custom Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .tab-button { transition: all 0.2s; }
        .tab-button.active {
            border-bottom: 3px solid #10b981;
            color: #10b981;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">

    <div class="max-w-7xl mx-auto p-6">

    <!-- Header -->
    <div class="flex items-center justify-between mb-10">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-emerald-600 rounded-3xl flex items-center justify-center text-3xl">💊</div>
            <div>
                <h1 class="text-4xl font-semibold tracking-tight">Supplement Hub</h1>
                <div class="flex items-center gap-3 text-sm">
                    <span class="text-slate-500 dark:text-slate-400">Real Data Entry</span>
                    <span id="branch-indicator" class="text-xs bg-emerald-100 dark:bg-emerald-900 text-emerald-700 px-3 py-1 rounded-full font-mono">round-8.1</span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <select id="user-selector" onchange="switchUser(this.value)" class="bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-3xl px-5 py-3 text-sm">
                <option value="Mark">👤 Mark</option>
                <option value="Lisa">👤 Lisa</option>
                <option value="Shared">👥 Shared</option>
            </select>

            <button onclick="toggleTheme()" class="w-11 h-11 flex items-center justify-center text-2xl hover:bg-slate-200 dark:hover:bg-slate-800 rounded-2xl">
                <span id="theme-icon">☀️</span>
            </button>
            <div class="relative group">
                <button onclick="toggleHamburgerMenu()" class="w-11 h-11 flex items-center justify-center text-3xl hover:bg-slate-200 dark:hover:bg-slate-800 rounded-2xl">☰</button>
                <div id="hamburger-menu" class="hidden absolute right-0 mt-2 w-64 bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 py-2 z-50">
                    
                    <a onclick="refreshFromCloud(); closeHamburgerMenu()" class="block px-6 py-3 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer">🔄 Refresh from Cloud</a>
                    
                    <a onclick="importData(); closeHamburgerMenu()" class="block px-6 py-3 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer">⬇️ Import Backup</a>
                    <a onclick="exportData(); closeHamburgerMenu()" class="block px-6 py-3 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer">⬆️ Export Backup</a>
                    <a onclick="installApp(); closeHamburgerMenu()" class="block px-6 py-3 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer">📲 Install App</a>
                    
                    <div class="border-t my-1 border-slate-200 dark:border-slate-700"></div>
                    
                    <a onclick="signOut(); closeHamburgerMenu()" class="block px-6 py-3 text-red-600 hover:bg-red-50 dark:hover:bg-red-950 cursor-pointer">Sign Out</a>
                </div>
            </div>
        </div>
</div>

        <!-- Tab Buttons -->
        <div class="flex border-b border-slate-300 dark:border-slate-700 mb-8">
            <button onclick="switchTab(0)" class="tab-button active px-8 py-4">Bottles</button>
            <button onclick="switchTab(1)" class="tab-button px-8 py-4">Weekly Planner</button>
            <button onclick="switchTab(2)" class="tab-button px-8 py-4">Over Limits</button>
            <button onclick="switchTab(3)" class="tab-button px-8 py-4">Shopping</button>
        </div>

        <!-- Tab Contents -->
        <div id="bottles-content" class="tab-content active" style="display: block;"></div>
        <div id="planner-content" class="tab-content" style="display: none;"></div>
        <div id="overlimits-content" class="tab-content" style="display: none;"></div>
        <div id="shopping-content" class="tab-content" style="display: none;"></div>

    <!-- Login Screen -->
    <div id="login-screen" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center hidden">
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-10 max-w-md w-full text-center shadow-2xl">
            <div class="w-20 h-20 bg-emerald-600 rounded-3xl flex items-center justify-center text-5xl mx-auto mb-6">💊</div>
            <h1 class="text-4xl font-semibold mb-2">Supplement Hub</h1>
            <p class="text-slate-500 dark:text-slate-400 mb-10">Sign in to sync your data across devices</p>
            
            <button onclick="signInWithGoogle()" 
                    class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 dark:bg-slate-700 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 py-4 px-6 rounded-2xl text-lg font-medium">
                <img src="https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" width="24" height="24">
                Sign in with Google
            </button>
        </div>
    </div>


    <!-- Scripts -->

    <!-- Firebase SDKs - MUST load FIRST -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

    <!-- Our code - Load ONLY ONCE -->
    <script src="firebase.js"></script>
    <script src="app.js"></script>

    <!-- Tab files -->
    <script src="bottles.js"></script>
    <script src="planner.js"></script>
    <script src="overlimits.js"></script>
    <script src="shopping.js"></script>

    <script>
        // Register Service Worker with cache busting disabled for now
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('✅ Service Worker registered'))
                .catch(err => console.log('Service Worker failed:', err));
        }
    </script>
</body>
</html>
